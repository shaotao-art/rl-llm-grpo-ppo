# Loss sweep | loss_type=grpo, loss_aggregate_type=token (Dr.GRPO style, 固定常数归一化)
# baseline: no-ref, lr=5e-5, eps=0.2, w_format_r=1.0
# 模型 / 数据
model_name: "/tmp/model_cache/Qwen3-0.6B"
data_p: "data/gsm8k"

# LoRA
lora_rank: 8
lora_alpha: 32

# 优化器
max_lr: 5.0e-5
min_lr: 1.0e-6
weight_decay: 1.0e-4
max_grad_norm: 1.0

# 训练 / rollout (loss sweep 期间固定的基线)
temperature: 1.0
max_new_tokens: 512
eps: 0.2                # 固定 (对称 clip)
w_format_r: 1.0
use_ref_model: false
kl_weight:
num_gen: 8
ppo_num_epoch: 1
train_prompt_size: 16
gradient_accumulation_steps: 1
ppo_train_mini_bs: 8
rollout_mini_bs: 8
val_bs: 32
num_epoch: 2
eval_ratio: 0.25

# loss (<<< sweep 变量)
loss_type: "grpo"
loss_aggregate_type: "token"
token_norm_const: 512  # 默认取 max_new_tokens

# 输出
save_root: "./saves/loss_sweep/grpo-token"
