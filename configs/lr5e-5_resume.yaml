# LR sweep - lr=5e-5 | 基线: kl_weight=0.1, eps=0.2, temperature=1.0
# 断点续训: 从 save_root/checkpoints 下最新的 step_* 恢复
# 模型 / 数据
model_name: "/tmp/model_cache/Qwen3-0.6B"
data_p: "data/gsm8k"

# LoRA
lora_rank: 8
lora_alpha: 32

# 优化器
max_lr: 5.0e-5          # <<< sweep 变量
min_lr: 1.0e-6
weight_decay: 1.0e-4
max_grad_norm: 1.0

# 训练 / rollout (调 LR 期间固定的基线)
temperature: 1.0        # 固定
max_new_tokens: 512
eps: 0.2                # 固定 (标准 clip)
w_format_r: 0.1
use_ref_model: true
kl_weight: 0.1          # 固定
num_gen: 8              # 固定
ppo_num_epoch: 1        # 固定
train_prompt_size: 16
gradient_accumulation_steps: 1
ppo_train_mini_bs: 8
rollout_mini_bs: 8
val_bs: 32
num_epoch: 2
eval_ratio: 0.25

# 断点续训
# - "latest": 自动选择 save_root/checkpoints 下 step_ 最大的 checkpoint
# - 也可写具体路径, 如 "step_1360" 或绝对路径
resume_from: "latest"

# 输出 (需与原训练一致, 否则会去错误的目录找 checkpoint)
save_root: "./saves/lr_sweep/lr5e-5"
