# 模型 / 数据
model_name: "/tmp/model_cache/Qwen3-0.6B"
data_p: "data/gsm8k"

# LoRA
lora_rank: 8
lora_alpha: 32

# 优化器
max_lr: 2.0e-5
min_lr: 1.0e-6
weight_decay: 0.0
max_grad_norm: 0.5

# 生成 / rollout
temperature: 1.0
max_new_tokens: 512
w_format_r: 0.1
use_ref_model: true
kl_weight: 0.04

# PPO-specific
indep_value_model: false
vf_coef: 0.05
gamma: 1.0
gae_lambda: 0.95
entropy_coef: 0.0
eps: 0.2
value_clip_eps: 0.4
normalize_adv: true

# 训练批次
train_prompt_size: 16
num_gen: 1
gradient_accumulation_steps: 1
ppo_train_mini_bs: 8
ppo_num_epoch: 1
rollout_mini_bs: 8
val_bs: 32
num_epoch: 8
eval_ratio: 0.25

# 输出
save_root: "./saves/check/ppo_default"
