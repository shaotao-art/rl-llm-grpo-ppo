# 模型 / 数据
model_name: "/tmp/model_cache/Qwen3-0.6B"
data_p: "data/gsm8k"

# LoRA
lora_rank: 8
lora_alpha: 32

# 优化器
max_lr: 2.0e-5
min_lr: 1.0e-6
weight_decay: 1.0e-4
max_grad_norm: 1.0

# 训练 / rollout
temperature: 0.95
max_new_tokens: 512
eps: 0.1
w_format_r: 0.1
use_ref_model: true
kl_weight: 0.1

train_prompt_size: 16          # train_len = len(train set) / (train_prompt_size * world_size)
num_gen: 8                     # each rollout samples train_prompt_size * num_gen
gradient_accumulation_steps: 1 # gradient accumulation
ppo_train_mini_bs: 8           # effective train_bs = ppo_train_mini_bs * world_size * gradient_accumulation_steps
ppo_num_epoch: 1               # each rollout train x ep
rollout_mini_bs: 8             # bs during rollout to avoid oom
val_bs: 32                     # per device eval batch size -> val_len = len(val set) / (val_bs * world_size)
num_epoch: 4
eval_ratio: 0.1                # mid-epoch eval: eval (1/eval_ratio) times per epoch; 0 to disable

# 输出
save_root: "./saves/test"
