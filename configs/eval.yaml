# eval config
model_name: "/tmp/model_cache/Qwen3-0.6B"
checkpoint_path: null          # set to a LoRA checkpoint dir to eval a trained model

data_p: "data/gsm8k"
eval_split: "test"

# generation
max_new_tokens: 512
num_samples: 2                 # n samples per problem; 1 = greedy pass@1
temperature: 0.6               # 0.0 = greedy
top_p: 1.0

# batching
batch_size: 2                 # problems per dataloader batch
max_problems: 32             # null = all; set e.g. 100 for a quick sanity check

output_path: "./eval_results.json"
